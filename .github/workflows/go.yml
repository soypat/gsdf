# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # CPU only build and tests. GPU code compiles to stubs that return errors.
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Env disable Cgo
      run: echo "CGO_ENABLED=0" >> $GITHUB_ENV

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -coverprofile=coverage.txt -covermode=atomic ./...

    # - name: govulncheck # Causing too many false positive build failures.
    #   uses: golang/govulncheck-action@v1
    #   with:
    #     go-version-input: 1.22
    #     go-package: ./...

    - shell: bash
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: |
        # Replace `linux` below with the appropriate OS
        # Options are `alpine`, `linux`, `macos`, `windows`
        # You will need to setup the environment variables below in github
        # and the project in codecov.io
        go test -v -coverprofile=coverage.txt -covermode=atomic ./...
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov
        CODECOV_TOKEN=$CODECOV_TOKEN ./codecov

  # GPU tests on a software Vulkan implementation (lavapipe) via WebGPU (wgpu-native).
  gpu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Vulkan software driver and GLFW build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libegl1-mesa-dev \
          libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libxkbcommon-dev libwayland-dev

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

    - name: Test GPU package
      run: go test -v ./gpusdf/...

    - name: Test CPU vs GPU evaluation
      run: go test -v . -args -gsdf.requiregpu

  # Browser (WebAssembly) build.
  wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build
      run: GOOS=js GOARCH=wasm go build -v ./...

    - name: Vet
      run: GOOS=js GOARCH=wasm go vet ./...
